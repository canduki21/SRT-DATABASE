<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martian Region Explorer — Space Resource Technologies</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #05060f; --srt-orange: #c87a41; }
  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 3rem 1.5rem;
  }
  .wrap {
    width: 100%;
    max-width: 1080px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }
  .mars-stage {
    position: relative;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }
  .mars-clip {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 80px rgba(180,80,30,0.18);
  }
  .mars-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transform: scale(1.05);
  }
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    aspect-ratio: 1;
    pointer-events: none;
  }
  .hotspot {
    position: absolute;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
    cursor: pointer;
    pointer-events: all;
    z-index: 20;
    -webkit-tap-highlight-color: transparent;
  }
  .hs-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.2s, border-color 0.2s;
    position: relative;
  }
  .hs-inner::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    animation: ripple 2.6s ease-out infinite;
  }
  @keyframes ripple {
    0%   { transform: scale(0.7); opacity: 0.6; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  .hotspot.active .hs-inner,
  .hotspot:hover .hs-inner {
    background: rgba(255,255,255,0.22);
    border-color: #fff;
    transform: scale(1.18);
  }
  .hotspot.active .hs-inner::before,
  .hotspot:hover .hs-inner::before { animation: none; opacity: 0; }
  .hs-dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .lines-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: 15;
  }
  .eyebrow { font-size: 50px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--srt-orange); margin-bottom: 1.8rem; }
  .panel { min-height: 300px; }
  .panel-empty { display: flex; flex-direction: column; gap: 0.8rem; padding-top: 1rem; }
  .panel-empty p { font-size: 25px; color: rgba(255,255,255,0.3); line-height: 1.7; max-width: 32ch; }
  .pulse-dots { display: flex; gap: 7px; }
  .pulse-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); display: inline-block; animation: pdot 1.8s infinite; font-style: normal; }
  .pulse-dots i:nth-child(2) { animation-delay: 0.25s; }
  .pulse-dots i:nth-child(3) { animation-delay: 0.5s; }
  @keyframes pdot { 0%,100%{opacity:0.2} 50%{opacity:0.8} }
  .badge { display: inline-block; padding: 4px 13px; border-radius: 20px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.03em; margin-bottom: 0.9rem; }
  .region-title { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.65rem; }
  .region-desc { font-size: 13.5px; color: rgba(255,255,255,0.5); line-height: 1.75; margin-bottom: 1.4rem; max-width: 38ch; }
  .sims-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.3); margin-bottom: 0.55rem; }
  .sims-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 7px; }
  .sim-card { display: block; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 9px 11px; text-decoration: none; transition: background 0.18s, border-color 0.18s, transform 0.18s; }
  .sim-card:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.28); transform: translateY(-1px); }
  .sim-name { display: block; font-size: 13px; font-weight: 500; color: #fff; margin-bottom: 2px; }
  .sim-sub { display: block; font-size: 10.5px; color: rgba(255,255,255,0.38); line-height: 1.4; }
  @media (max-width: 740px) {
    .wrap { grid-template-columns: 1fr; gap: 2rem; }
    .mars-stage { max-width: 320px; }
    .region-title { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mars-side">
    <div class="mars-stage">

      <div class="mars-clip">
        <img class="mars-img" id="mars-img" src="" alt="Mars">
      </div>

      <svg class="lines-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

        <!-- Jezero Crater: hotspot at 66,27 — label upper right -->
        <text x="68" y="16"
              font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
              font-size="4.8" fill="rgba(255,255,255,0.85)" letter-spacing="0.04em">Jezero Crater</text>

        <!-- Gale Crater: hotspot at 62,53 — label right -->
        <text x="64" y="62"
              font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
              font-size="4.8" fill="rgba(255,255,255,0.85)" letter-spacing="0.04em">Gale Crater</text>

        <!-- Tharsis Volcanics: hotspot at 28,40 — label left -->
        <text x="3" y="33"
              font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
              font-size="4.8" fill="rgba(255,255,255,0.85)" letter-spacing="0.04em">Tharsis</text>
        <text x="3" y="39"
              font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
              font-size="4.8" fill="rgba(255,255,255,0.85)" letter-spacing="0.04em">Volcanics</text>

      </svg>

      <div class="overlay">
        <div class="hotspot" id="hs-jezero" style="left:66%;top:27%;" onclick="show('jezero')" tabindex="0" role="button" aria-label="Jezero Crater">
          <div class="hs-inner"><div class="hs-dot"></div></div>
        </div>
        <div class="hotspot" id="hs-gale" style="left:62%;top:53%;" onclick="show('gale')" tabindex="0" role="button" aria-label="Gale Crater">
          <div class="hs-inner"><div class="hs-dot"></div></div>
        </div>
        <div class="hotspot" id="hs-tharsis" style="left:28%;top:40%;" onclick="show('tharsis')" tabindex="0" role="button" aria-label="Tharsis Volcanics">
          <div class="hs-inner"><div class="hs-dot"></div></div>
        </div>
      </div>

    </div>
  </div>

  <div class="info-side">
    <p class="eyebrow">Martian Region Explorer</p>
    <div class="panel" id="panel">
      <div class="panel-empty">
        <p>Select a region on Mars to explore its terrain and available simulants.</p>
        <div class="pulse-dots"><i></i><i></i><i></i></div>
      </div>
    </div>
  </div>
</div>

function show(key) {
  var r = regions[key];
  document.querySelectorAll('.hotspot').forEach(function(h){ h.classList.remove('active'); });
  document.getElementById('hs-' + key).classList.add('active');
  var chips = r.sims.map(function(s){
    return '<a class="sim-card" href="' + s.u + '" target="_blank" rel="noopener"><span class="sim-name">' + s.n + '</span><span class="sim-sub">' + s.s + '</span></a>';
  }).join('');
  document.getElementById('panel').innerHTML =
    '<span class="badge" style="background:' + r.badge.bg + ';color:' + r.badge.color + ';border:1px solid ' + r.badge.bdr + ';">' + r.badge.label + '</span>' +
    '<div class="region-title">' + r.title + '</div>' +
    '<div class="region-desc">' + r.desc + '</div>' +
    '<div class="sims-label">Available simulants</div>' +
    '<div class="sims-grid">' + chips + '</div>';
}
document.querySelectorAll('.hotspot').forEach(function(h){
  h.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h.click(); }
  });
});
