<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Bed Configurator — Space Resource Technologies</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:      #05060f;
  --panel:   #0d0e1a;
  --border:  rgba(255,255,255,0.08);
  --orange:  #c87a41;
  --orange2: rgba(200,122,65,0.15);
  --text:    #fff;
  --muted:   rgba(255,255,255,0.38);
  --input-bg:#111320;
  --sidebar: 300px;
}
html, body { height:100%; overflow:hidden; }
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
header {
  flex-shrink: 0;
  height: 52px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 1.4rem;
  gap: 1rem;
  background: var(--panel);
  z-index: 10;
}
header .logo {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--orange);
  white-space: nowrap;
}
header h1 {
  font-size: 14px;
  font-weight: 500;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.01em;
}
header .sep { width:1px; height:20px; background:var(--border); }

/* ── Layout ── */
.layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar);
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 1.4rem;
}
#sidebar::-webkit-scrollbar { width:4px; }
#sidebar::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }

.section-label {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 0.55rem;
}

/* Toggle pills */
.pill-row {
  display: flex;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.pill-row button {
  flex: 1;
  padding: 7px 0;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.18s, color 0.18s;
}
.pill-row button.active {
  background: var(--orange);
  color: #fff;
}

/* Inputs */
.input-group { display:flex; flex-direction:column; gap:0.35rem; }
.input-row   { display:flex; gap:0.5rem; }
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}
.field label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.field input[type=number] {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  padding: 7px 10px;
  width: 100%;
  outline: none;
  transition: border-color 0.18s;
  -moz-appearance: textfield;
}
.field input[type=number]:focus { border-color: var(--orange); }
.field input[type=number]::-webkit-inner-spin-button,
.field input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }

/* Simulant cards */
.sim-group { margin-bottom:0.6rem; }
.sim-group-title {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 0.4rem;
  padding-left: 2px;
}
.sim-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.15s;
  margin-bottom: 3px;
}
.sim-option:hover { background: rgba(255,255,255,0.05); }
.sim-option.active { background: var(--orange2); }
.sim-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1.5px solid rgba(255,255,255,0.2);
}
.sim-option.active .sim-dot { border-color: var(--orange); }
.sim-info { display:flex; flex-direction:column; gap:1px; }
.sim-name  { font-size: 12px; color: rgba(255,255,255,0.75); }
.sim-meta  { font-size: 10px; color: var(--muted); }

/* Fill depth */
.slider-row { display:flex; flex-direction:column; gap:6px; }
.slider-header { display:flex; justify-content:space-between; align-items:baseline; }
.slider-val { font-size: 13px; color: var(--orange); font-weight:500; }
input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--input-bg);
  outline: none;
  border: 1px solid var(--border);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--orange);
  cursor: pointer;
  border: 2px solid #fff;
}

/* ── Viewport ── */
#viewport {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#c { display:block; width:100%; height:100%; }

/* Results overlay */
#results {
  position: absolute;
  bottom: 1.4rem;
  right: 1.4rem;
  background: rgba(13,14,26,0.88);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.1rem 1.3rem;
  min-width: 220px;
}
#results .res-title {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 0.8rem;
}
.res-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: 0.45rem;
}
.res-row .res-key { font-size: 11.5px; color: var(--muted); }
.res-row .res-val { font-size: 14px; font-weight:500; color:#fff; }
.res-divider { border:none; border-top:1px solid var(--border); margin:0.7rem 0; }
.res-cta {
  display: block;
  text-align: center;
  padding: 8px;
  background: var(--orange);
  color: #fff;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 500;
  text-decoration: none;
  transition: opacity 0.18s;
  margin-top:0.8rem;
}
.res-cta:hover { opacity:0.85; }
.res-empty {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding: 0.5rem 0;
}

/* Dimension labels */
.dim-label {
  position: absolute;
  pointer-events: none;
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  background: rgba(13,14,26,0.75);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 4px;
  padding: 2px 6px;
  white-space: nowrap;
  letter-spacing: 0.04em;
  transform: translate(-50%, -50%);
}

/* Empty state hint */
#hint {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
#hint.visible { opacity:1; }
#hint p { font-size:14px; color:var(--muted); }

@media (max-width:700px) {
  :root { --sidebar:100%; }
  .layout { flex-direction:column; }
  #sidebar { width:100%; max-height:45vh; border-right:none; border-bottom:1px solid var(--border); }
  #results { bottom:0.8rem; right:0.8rem; min-width:180px; }
}
</style>
</head>
<body>

<header>
  <span class="logo">SRT</span>
  <div class="sep"></div>
  <h1>Test Bed Configurator</h1>
</header>

<div class="layout">

  <!-- ── Sidebar ── -->
  <div id="sidebar">

    <!-- Units -->
    <div>
      <div class="section-label">Units</div>
      <div class="pill-row" id="unit-toggle">
        <button class="active" data-val="cm">cm</button>
        <button data-val="m">m</button>
        <button data-val="ft">ft</button>
      </div>
    </div>

    <!-- Shape -->
    <div>
      <div class="section-label">Shape</div>
      <div class="pill-row" id="shape-toggle">
        <button class="active" data-val="rect">Rectangular</button>
        <button data-val="sq">Square</button>
      </div>
    </div>

    <!-- Dimensions -->
    <div class="input-group">
      <div class="section-label">Dimensions</div>
      <div class="input-row">
        <div class="field">
          <label id="l-label">Length</label>
          <input type="number" id="inp-l" value="100" min="1" step="1">
        </div>
        <div class="field" id="w-field">
          <label id="w-label">Width</label>
          <input type="number" id="inp-w" value="60" min="1" step="1">
        </div>
      </div>
      <div class="input-row">
        <div class="field">
          <label id="d-label">Depth (container)</label>
          <input type="number" id="inp-d" value="30" min="1" step="1">
        </div>
        <div class="field">
          <label id="h-label">Simulant Height</label>
          <input type="number" id="inp-h" value="20" min="0" step="1">
        </div>
      </div>
    </div>

    <!-- Fill slider (fine control, synced with Height input) -->
    <div>
      <div class="section-label">Adjust simulant height</div>
      <div class="slider-row">
        <div class="slider-header">
          <span style="font-size:11px;color:var(--muted);">Height</span>
          <span class="slider-val"><span id="fill-val">20</span> <span id="fill-unit">cm</span></span>
        </div>
        <input type="range" id="fill-slider" min="0" max="30" value="20" step="0.5">
      </div>
    </div>

    <!-- Simulant selector -->
    <div>
      <div class="section-label">Simulant</div>
      <div id="sim-list"></div>
    </div>

  </div>

  <!-- ── 3D Viewport ── -->
  <div id="viewport">
    <canvas id="c"></canvas>

    <!-- Dimension labels (injected by JS) -->
    <div id="label-l" class="dim-label" style="display:none;"></div>
    <div id="label-w" class="dim-label" style="display:none;"></div>
    <div id="label-d" class="dim-label" style="display:none;"></div>
    <div id="label-h" class="dim-label" style="display:none;"></div>

    <!-- Results -->
    <div id="results">
      <div class="res-title">Simulant Required</div>
      <div id="res-body"><div class="res-empty">Enter dimensions to calculate</div></div>
    </div>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Simulant data ── */
const SIMULANTS = [
  { id:'lhs-1',  group:'Lunar', name:'Lunar Highlands (LHS-1)',  sub:'1.40 g/cm³ · Highlands',      density:1.40, hex:'#cac6bc', threeColor:0xcac6bc, price:45,  url:'https://spaceresourcetech.com/products/lhs-1-lunar-highlands-simulant' },
  { id:'lms-1',  group:'Lunar', name:'Lunar Mare (LMS-1)',       sub:'1.65 g/cm³ · Basaltic',        density:1.65, hex:'#727272', threeColor:0x727272, price:45,  url:'https://spaceresourcetech.com/products/lms-1-lunar-mare-simulant' },
  { id:'lsp-2',  group:'Lunar', name:'Lunar South Pole (LSP-2)', sub:'1.47 g/cm³ · Polar regolith',  density:1.47, hex:'#b2b8c6', threeColor:0xb2b8c6, price:55,  url:'https://spaceresourcetech.com/products/lunar-south-pole-simulant-lsp-2' },
  { id:'lhs-1e', group:'Lunar', name:'Lunar Highlands Eng. (LHS-1E)', sub:'1.37 g/cm³ · Engineering grade', density:1.37, hex:'#b8b4a8', threeColor:0xb8b4a8, price:35, url:'https://spaceresourcetech.com/products/lhs-1e-simplified-lunar-highlands-simulant' },
  { id:'mgs-1',  group:'Mars',  name:'Mars Global (MGS-1)',       sub:'1.33 g/cm³ · Global basaltic', density:1.33, hex:'#c4622d', threeColor:0xc4622d, price:45,  url:'https://spaceresourcetech.com/products/mgs-1-mars-global-simulant' },
  { id:'mgs-1c', group:'Mars',  name:'Mars Clay (MGS-1C)',        sub:'1.30 g/cm³ · Clay-enriched',   density:1.30, hex:'#8a7055', threeColor:0x8a7055, price:55,  url:'https://spaceresourcetech.com/products/mgs-1c-clay-isru' },
  { id:'mgs-1s', group:'Mars',  name:'Mars Sulfate (MGS-1S)',     sub:'1.33 g/cm³ · Sulfate-enriched',density:1.33, hex:'#c8a060', threeColor:0xc8a060, price:55,  url:'https://spaceresourcetech.com/products/mgs-1s-sulfate-isru' },
  { id:'jez-1',  group:'Mars',  name:'Jezero Delta (JEZ-1)',      sub:'1.30 g/cm³ · Jezero delta',    density:1.30, hex:'#9b7a55', threeColor:0x9b7a55, price:55,  url:'https://spaceresourcetech.com/products/jez-1-jezero-delta-simulant' },
];

/* ── State ── */
const state = {
  unit:      'cm',
  shape:     'rect',
  L:         100,
  W:         60,
  D:         30,
  fill:      20,
  simulant:  SIMULANTS[0],
};

/* ── Unit helpers ── */
const FT_TO_CM = 30.48;
const M_TO_CM  = 100;
function toCm(v) {
  if (state.unit === 'ft') return v * FT_TO_CM;
  if (state.unit === 'm')  return v * M_TO_CM;
  return v;
}
function fmtDim(cm) {
  if (state.unit === 'ft') return (cm / FT_TO_CM).toFixed(2) + ' ft';
  if (state.unit === 'm')  return (cm / M_TO_CM).toFixed(2) + ' m';
  return cm.toFixed(0) + ' cm';
}

/* ── Three.js setup ── */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x07091a);
scene.fog = new THREE.FogExp2(0x07091a, 0.018);

const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 500);
camera.position.set(4, 3, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance   = 0.5;
controls.maxDistance   = 50;
controls.maxPolarAngle = Math.PI / 2 + 0.15;

/* ── Lights ── */
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffeedd, 1.4);
sun.position.set(6, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.1;
sun.shadow.camera.far  = 60;
sun.shadow.camera.left = sun.shadow.camera.bottom = -10;
sun.shadow.camera.right = sun.shadow.camera.top   =  10;
scene.add(sun);

const fill2 = new THREE.DirectionalLight(0xaaccff, 0.4);
fill2.position.set(-4, 3, -4);
scene.add(fill2);

/* ── Grid (rebuilt dynamically to fit any box size) ── */
let grid = new THREE.GridHelper(40, 80, 0x1a1d3a, 0x141628);
scene.add(grid);

/* ── Scene objects ── */
let grp = new THREE.Group();
scene.add(grp);

const SCALE = 1/50; // 1 Three.js unit = 50 cm

function fitCamera() {
  const L = state.L * SCALE, W = state.W * SCALE, D = state.D * SCALE;
  const diag = Math.sqrt(L*L + W*W + D*D);
  const dist  = Math.max(2.5, diag * 1.65);
  camera.position.set(dist * 0.82, dist * 0.55, dist * 0.82);
  controls.maxDistance = dist * 8;
  // Scale fog to keep scene visible at any size
  scene.fog.density = Math.max(0.002, 0.05 / dist);
  // Scale shadow frustum so shadows work on large boxes
  const half = Math.max(10, Math.max(L, W, D) * 0.75);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -half;
  sun.shadow.camera.right = sun.shadow.camera.top   =  half;
  sun.shadow.camera.far   = dist * 6;
  sun.shadow.camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

function buildScene() {
  grp.clear();

  const L = state.L * SCALE;
  const W = state.W * SCALE;
  const D = state.D * SCALE;
  const F = Math.min(state.fill, state.D) * SCALE;
  const sim = state.simulant;

  // Auto-fit camera + scene to current box size
  fitCamera();

  // Rebuild grid so it always extends well beyond the box
  scene.remove(grid);
  const gridSpan  = Math.max(40, Math.ceil(Math.max(L, W)) * 5);
  const gridCells = Math.min(200, gridSpan * 2);
  grid = new THREE.GridHelper(gridSpan, gridCells, 0x1a1d3a, 0x141628);
  scene.add(grid);

  // Position grid at base of container
  grid.position.y = -D / 2 - 0.001;

  // ── Container walls (open top box) ──
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x9aaabb, metalness: 0.55, roughness: 0.45,
    transparent: true, opacity: 0.12, side: THREE.DoubleSide
  });

  // Bottom
  addPanel(grp, L, 0.005, W, 0, -D/2 + 0.0025, 0, wallMat, true);
  // Front wall
  addPanel(grp, L, D, 0.005, 0, 0, W/2, wallMat, true);
  // Back wall
  addPanel(grp, L, D, 0.005, 0, 0, -W/2, wallMat, true);
  // Left wall
  addPanel(grp, 0.005, D, W, -L/2, 0, 0, wallMat, true);
  // Right wall
  addPanel(grp, 0.005, D, W,  L/2, 0, 0, wallMat, true);

  // Edges (full box edges so opening is visible)
  const boxGeo = new THREE.BoxGeometry(L, D, W);
  const edges   = new THREE.EdgesGeometry(boxGeo);
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x8899bb, linewidth:1 });
  const edgeLines = new THREE.LineSegments(edges, edgeMat);
  grp.add(edgeLines);

  // ── Simulant fill ──
  if (F > 0.001) {
    const fillGeo = new THREE.BoxGeometry(L * 0.994, F, W * 0.994);
    const fillMat = new THREE.MeshStandardMaterial({
      color: sim.threeColor,
      roughness: 0.92,
      metalness: 0.0,
    });
    const fillMesh = new THREE.Mesh(fillGeo, fillMat);
    fillMesh.position.y = -D/2 + F/2;
    fillMesh.receiveShadow = true;
    grp.add(fillMesh);

    // Thin highlight line at fill surface
    const topEdgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(L*0.994, 0.002, W*0.994));
    const topEdgeMat = new THREE.LineBasicMaterial({ color: new THREE.Color(sim.hex).lerp(new THREE.Color(0xffffff), 0.4) });
    const topEdge = new THREE.LineSegments(topEdgeGeo, topEdgeMat);
    topEdge.position.y = -D/2 + F;
    grp.add(topEdge);
  }

  // Camera target center
  controls.target.set(0, 0, 0);
}

function addPanel(parent, w, h, d, x, y, z, mat, shadow) {
  const geo  = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  if (shadow) { mesh.castShadow = false; mesh.receiveShadow = true; }
  parent.add(mesh);
}

/* ── Results ── */
function updateResults() {
  const L_cm   = state.L;
  const W_cm   = state.W;
  const fill_cm = Math.min(state.fill, state.D);
  const sim    = state.simulant;

  if (L_cm <= 0 || W_cm <= 0 || fill_cm <= 0) {
    document.getElementById('res-body').innerHTML = '<div class="res-empty">Enter dimensions to calculate</div>';
    return;
  }

  const vol_cm3 = L_cm * W_cm * fill_cm;
  const vol_L   = vol_cm3 / 1000;
  const mass_kg = vol_cm3 * sim.density / 1000;
  const bags    = Math.ceil(mass_kg);
  const cost    = bags * sim.price;

  document.getElementById('res-body').innerHTML = `
    <div class="res-row"><span class="res-key">Fill volume</span><span class="res-val">${vol_L.toFixed(1)} L</span></div>
    <div class="res-row"><span class="res-key">Volume</span><span class="res-val">${(vol_cm3/1e6).toFixed(3)} m³</span></div>
    <div class="res-row"><span class="res-key">Required mass</span><span class="res-val">${mass_kg.toFixed(1)} kg</span></div>
    <hr class="res-divider">
    <div class="res-row"><span class="res-key">Bags needed</span><span class="res-val">${bags} × 1 kg</span></div>
    <div class="res-row"><span class="res-key">Est. cost</span><span class="res-val">$${cost.toLocaleString()}</span></div>
    <a class="res-cta" href="${sim.url}" target="_blank" rel="noopener">Shop ${sim.name.split(' (')[0]} →</a>
  `;
}

/* ── Dimension labels ── */
const lblL = document.getElementById('label-l');
const lblW = document.getElementById('label-w');
const lblD = document.getElementById('label-d');
const lblH = document.getElementById('label-h');

const v3 = new THREE.Vector3();
function project(x, y, z) {
  v3.set(x, y, z);
  v3.project(camera);
  const vp = renderer.domElement.getBoundingClientRect();
  return {
    x: (v3.x + 1) / 2 * vp.width,
    y: (-v3.y + 1) / 2 * vp.height
  };
}

function updateLabels() {
  const L = state.L * SCALE, W = state.W * SCALE, D = state.D * SCALE;
  const F = Math.min(state.fill, state.D) * SCALE;

  const pL = project(0,  D/2 + 0.12, -W/2 - 0.15);
  const pW = project(L/2 + 0.15, D/2 + 0.12, 0);
  const pD = project(L/2 + 0.15, 0,  W/2 + 0.1);
  const pH = project(-L/2 - 0.15, -D/2 + F/2, 0);

  function setLbl(el, pos, text) {
    if (pos.x < 0 || pos.y < 0) { el.style.display='none'; return; }
    el.style.display = 'block';
    el.style.left = pos.x + 'px';
    el.style.top  = pos.y + 'px';
    el.textContent = text;
  }

  setLbl(lblL, pL, 'L: ' + fmtDim(state.L));
  setLbl(lblW, pW, 'W: ' + fmtDim(state.W));
  setLbl(lblD, pD, 'D: ' + fmtDim(state.D));
  if (F > 0.001) setLbl(lblH, pH, 'H: ' + fmtDim(Math.min(state.fill, state.D)));
  else lblH.style.display = 'none';
}

/* ── Resize ── */
function onResize() {
  const vp = document.getElementById('viewport');
  const w  = vp.clientWidth, h = vp.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

/* ── Animation loop ── */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
}
animate();

/* ── UI setup ── */
function buildSimList() {
  const container = document.getElementById('sim-list');
  const groups = {};
  SIMULANTS.forEach(s => { (groups[s.group] = groups[s.group] || []).push(s); });

  Object.entries(groups).forEach(([gname, sims]) => {
    const gDiv = document.createElement('div');
    gDiv.className = 'sim-group';
    gDiv.innerHTML = `<div class="sim-group-title">${gname}</div>`;
    sims.forEach(s => {
      const el = document.createElement('div');
      el.className = 'sim-option' + (s === state.simulant ? ' active' : '');
      el.dataset.id = s.id;
      el.innerHTML = `
        <div class="sim-dot" style="background:${s.hex};"></div>
        <div class="sim-info">
          <span class="sim-name">${s.name}</span>
          <span class="sim-meta">${s.sub}</span>
        </div>`;
      el.addEventListener('click', () => {
        state.simulant = s;
        document.querySelectorAll('.sim-option').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        buildScene();
        updateResults();
      });
      gDiv.appendChild(el);
    });
    container.appendChild(gDiv);
  });
}

function setupPills(id, key, onChange) {
  document.getElementById(id).querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(id).querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[key] = btn.dataset.val;
      onChange && onChange(btn.dataset.val);
    });
  });
}

function syncUnitLabels() {
  const u = state.unit;
  document.getElementById('l-label').textContent = `Length (${u})`;
  document.getElementById('w-label').textContent = `Width (${u})`;
  document.getElementById('d-label').textContent = `Depth (${u})`;
  document.getElementById('h-label').textContent = `Simulant Height (${u})`;
  document.getElementById('fill-unit').textContent = u;

  // Convert existing values when toggling units
  const inputs = ['l','w','d'];
  const keys   = ['L','W','D'];
  inputs.forEach((id, i) => {
    const inp = document.getElementById('inp-' + id);
    if (u === 'ft') {
      inp.value = (state[keys[i]] / FT_TO_CM).toFixed(2);
      inp.step  = '0.1';
    } else if (u === 'm') {
      inp.value = (state[keys[i]] / M_TO_CM).toFixed(2);
      inp.step  = '0.01';
    } else {
      inp.value = Math.round(state[keys[i]]);
      inp.step  = '1';
    }
  });

  // Simulant height input (mirrors fill state)
  const hInp = document.getElementById('inp-h');
  if (u === 'ft') {
    hInp.value = (state.fill / FT_TO_CM).toFixed(2);
    hInp.step  = '0.01';
  } else if (u === 'm') {
    hInp.value = (state.fill / M_TO_CM).toFixed(2);
    hInp.step  = '0.005';
  } else {
    hInp.value = state.fill.toFixed(1);
    hInp.step  = '0.5';
  }

  // Fill slider
  const fillInp = document.getElementById('fill-slider');
  if (u === 'ft') {
    fillInp.max   = (state.D / FT_TO_CM).toFixed(2);
    fillInp.value = (state.fill / FT_TO_CM).toFixed(2);
    fillInp.step  = '0.01';
    document.getElementById('fill-val').textContent = (state.fill / FT_TO_CM).toFixed(2);
  } else if (u === 'm') {
    fillInp.max   = (state.D / M_TO_CM).toFixed(2);
    fillInp.value = (state.fill / M_TO_CM).toFixed(2);
    fillInp.step  = '0.005';
    document.getElementById('fill-val').textContent = (state.fill / M_TO_CM).toFixed(2);
  } else {
    fillInp.max   = state.D;
    fillInp.value = state.fill;
    fillInp.step  = '0.5';
    document.getElementById('fill-val').textContent = state.fill.toFixed(1);
  }
}

setupPills('unit-toggle', 'unit', () => { syncUnitLabels(); });

setupPills('shape-toggle', 'shape', (val) => {
  const wField = document.getElementById('w-field');
  if (val === 'sq') {
    wField.style.display = 'none';
    state.W = state.L;
    document.getElementById('inp-w').value = document.getElementById('inp-l').value;
  } else {
    wField.style.display = '';
  }
  buildScene(); updateResults();
});

function readInput(id) {
  const val = parseFloat(document.getElementById('inp-' + id).value) || 0;
  if (state.unit === 'ft') return val * FT_TO_CM;
  if (state.unit === 'm')  return val * M_TO_CM;
  return val;
}

['l','w','d'].forEach(id => {
  document.getElementById('inp-' + id).addEventListener('input', () => {
    const key = id.toUpperCase();
    state[key] = readInput(id);
    if (state.shape === 'sq' && id === 'l') {
      state.W = state.L;
      document.getElementById('inp-w').value = document.getElementById('inp-l').value;
    }
    // Keep fill ≤ depth
    if (state.fill > state.D) { state.fill = state.D; }
    // Update fill slider max
    const fillSlider = document.getElementById('fill-slider');
    if (state.unit === 'ft')     fillSlider.max = (state.D / FT_TO_CM).toFixed(2);
    else if (state.unit === 'm') fillSlider.max = (state.D / M_TO_CM).toFixed(2);
    else                         fillSlider.max = state.D;
    if (parseFloat(fillSlider.value) > parseFloat(fillSlider.max)) {
      fillSlider.value = fillSlider.max;
      state.fill = state.D;
    }
    buildScene(); updateResults();
  });
});

// inp-h (simulant height typed input) — mirrors fill slider
document.getElementById('inp-h').addEventListener('input', () => {
  const raw = parseFloat(document.getElementById('inp-h').value) || 0;
  state.fill = toCm(raw);
  if (state.fill > state.D) state.fill = state.D;
  const fillSliderEl = document.getElementById('fill-slider');
  const displayVal = (state.unit === 'ft') ? (state.fill / FT_TO_CM).toFixed(2)
                   : (state.unit === 'm')  ? (state.fill / M_TO_CM).toFixed(2)
                   : state.fill.toFixed(1);
  fillSliderEl.value = displayVal;
  document.getElementById('fill-val').textContent = displayVal;
  buildScene(); updateResults();
});

const fillSlider = document.getElementById('fill-slider');
fillSlider.addEventListener('input', () => {
  const raw = parseFloat(fillSlider.value) || 0;
  if (state.unit === 'ft')     state.fill = raw * FT_TO_CM;
  else if (state.unit === 'm') state.fill = raw * M_TO_CM;
  else                         state.fill = raw;
  const display = (state.unit === 'cm') ? raw.toFixed(1) : raw.toFixed(2);
  document.getElementById('fill-val').textContent = display;
  document.getElementById('inp-h').value = display;
  buildScene(); updateResults();
});

/* ── Init ── */
buildSimList();
syncUnitLabels();
buildScene();   // fitCamera() is called inside buildScene
updateResults();
</script>
</body>
</html>
