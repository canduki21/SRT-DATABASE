<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroid Simulant Explorer — Space Resource Technologies</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #05060f; --srt-orange: #c87a41; }
  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .wrap {
    width: 100%;
    max-width: 1100px;
    display: grid;
    grid-template-columns: 280px 1fr 280px;
    gap: 2.5rem;
    align-items: center;
  }

  /* ── Asteroid cards ── */
  .asteroid-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    cursor: pointer;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .asteroid-img-wrap {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.06);
    transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
    position: relative;
  }
  .asteroid-card:hover .asteroid-img-wrap {
    transform: translateY(-5px);
    border-color: rgba(255,255,255,0.2);
  }
  .asteroid-card.active .asteroid-img-wrap {
    border-color: var(--srt-orange);
    box-shadow: 0 0 0 1px rgba(200,122,65,0.3), 0 0 50px rgba(200,122,65,0.25);
    transform: translateY(-5px);
  }

  /* Pulse ring hint */
  .asteroid-img-wrap::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.12);
    animation: aring 3.2s ease-out infinite;
    pointer-events: none;
    z-index: 10;
  }
  .asteroid-card.active .asteroid-img-wrap::before,
  .asteroid-card:hover .asteroid-img-wrap::before { animation: none; opacity: 0; }
  @keyframes aring {
    0%   { opacity: 0.5; transform: scale(0.96); }
    100% { opacity: 0;   transform: scale(1.08); }
  }

  .asteroid-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s;
  }
  .asteroid-card:hover .asteroid-img,
  .asteroid-card.active .asteroid-img {
    transform: scale(1.04);
  }

  /* Label below image */
  .asteroid-label {
    text-align: center;
    line-height: 1.5;
  }
  .asteroid-label .code {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.06em;
    transition: color 0.25s;
  }
  .asteroid-label .name {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: rgba(255,255,255,0.3);
    transition: color 0.25s;
  }
  .asteroid-label .source {
    display: block;
    font-size: 10px;
    color: rgba(255,255,255,0.18);
    margin-top: 2px;
    letter-spacing: 0.04em;
  }
  .asteroid-card.active .asteroid-label .code { color: var(--srt-orange); }
  .asteroid-card.active .asteroid-label .name { color: rgba(200,122,65,0.7); }

  /* Selection dot */
  .asteroid-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: background 0.25s;
  }
  .asteroid-card.active .asteroid-dot { background: var(--srt-orange); }

  /* ── Center info panel ── */
  .info-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0;
  }
  .eyebrow {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--srt-orange);
    margin-bottom: 0.5rem;
  }
  .main-title {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 2rem;
    color: rgba(255,255,255,0.9);
  }
  .panel { width: 100%; min-height: 260px; }
  .panel-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 1rem 0;
  }
  .panel-empty p {
    font-size: 14px;
    color: rgba(255,255,255,0.28);
    line-height: 1.7;
    max-width: 26ch;
  }
  .arrow-hints {
    display: flex;
    gap: 2rem;
    color: rgba(255,255,255,0.15);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .pulse-dots { display: flex; gap: 6px; justify-content: center; margin-top: 0.25rem; }
  .pulse-dots i {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    display: inline-block;
    animation: pdot 1.8s infinite;
    font-style: normal;
  }
  .pulse-dots i:nth-child(2) { animation-delay: 0.25s; }
  .pulse-dots i:nth-child(3) { animation-delay: 0.5s; }
  @keyframes pdot { 0%,100%{opacity:0.18} 50%{opacity:0.7} }

  .badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    margin-bottom: 0.85rem;
  }
  .sim-title {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 0.6rem;
    color: #fff;
  }
  .sim-desc {
    font-size: 12.5px;
    color: rgba(255,255,255,0.45);
    line-height: 1.8;
    margin-bottom: 1.3rem;
    max-width: 34ch;
    margin-left: auto;
    margin-right: auto;
  }
  .sims-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.25);
    margin-bottom: 0.5rem;
  }
  .sim-card {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 9px 18px;
    text-decoration: none;
    transition: background 0.18s, border-color 0.18s, transform 0.18s;
    min-width: 110px;
  }
  .sim-card:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.28);
    transform: translateY(-2px);
  }
  .sim-name { font-size: 14px; font-weight: 600; color: #fff; }
  .sim-sub  { font-size: 10px; color: rgba(255,255,255,0.38); margin-top: 2px; }

  @media (max-width: 760px) {
    .wrap {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
    }
    .info-center {
      grid-column: 1 / -1;
      order: 3;
    }
    .main-title { font-size: 22px; }
  }
  @media (max-width: 480px) {
    .wrap { grid-template-columns: 1fr; }
    .info-center { order: 1; }
    .asteroid-card { flex-direction: row; gap: 1rem; }
    .asteroid-img-wrap { width: 90px; height: 90px; flex-shrink: 0; }
  }
</style>
</head>
