<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Simulant Explorer — Space Resource Technologies</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #05060f; --srt-orange: #c87a41; }
  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 3rem 1.5rem;
  }
  .wrap {
    width: 100%;
    max-width: 1080px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }

  .moon-stage {
    position: relative;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }

  /* The clipped circle */
  .moon-clip {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 80px rgba(200,180,140,0.10);
  }
  .moon-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transform: scale(1.08);
  }

  /* 
    Overlay layer — same size as moon-clip, sits directly on top.
    All hotspots and labels live here.
  */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    aspect-ratio: 1;
    pointer-events: none;
  }

  /* ── Hotspots ── */
  .hotspot {
    position: absolute;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
    cursor: pointer;
    pointer-events: all;
    z-index: 20;
    -webkit-tap-highlight-color: transparent;
  }
  .hs-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.2s, border-color 0.2s;
    position: relative;
  }
  .hs-inner::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    animation: ripple 2.6s ease-out infinite;
  }
  @keyframes ripple {
    0%   { transform: scale(0.7); opacity: 0.6; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  .hotspot.active .hs-inner,
  .hotspot:hover .hs-inner {
    background: rgba(255,255,255,0.22);
    border-color: #fff;
    transform: scale(1.18);
  }
  .hotspot.active .hs-inner::before,
  .hotspot:hover .hs-inner::before { animation: none; opacity: 0; }
  .hs-dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; }

  /*
    SVG for lines + labels only — drawn over the overlay, no pointer events.
    viewBox matches the overlay square so % coords map 1:1.
  */
  .lines-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: 15;
  }

  /* ── Info panel ── */
  .eyebrow { font-size: 50px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--srt-orange); margin-bottom: 1.8rem; }
  .panel { min-height: 300px; }
  .panel-empty { display: flex; flex-direction: column; gap: 0.8rem; padding-top: 1rem; }
  .panel-empty p { font-size: 25px; color: rgba(255,255,255,0.3); line-height: 1.7; max-width: 32ch; }
  .pulse-dots { display: flex; gap: 7px; }
  .pulse-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); display: inline-block; animation: pdot 1.8s infinite; font-style: normal; }
  .pulse-dots i:nth-child(2) { animation-delay: 0.25s; }
  .pulse-dots i:nth-child(3) { animation-delay: 0.5s; }
  @keyframes pdot { 0%,100%{opacity:0.2} 50%{opacity:0.8} }
  .badge { display: inline-block; padding: 4px 13px; border-radius: 20px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.03em; margin-bottom: 0.9rem; }
  .region-title { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.65rem; }
  .region-desc { font-size: 13.5px; color: rgba(255,255,255,0.5); line-height: 1.75; margin-bottom: 1.4rem; max-width: 38ch; }
  .sims-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.3); margin-bottom: 0.55rem; }
  .sims-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 7px; }
  .sim-card { display: block; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 9px 11px; text-decoration: none; transition: background 0.18s, border-color 0.18s, transform 0.18s; }
  .sim-card:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.28); transform: translateY(-1px); }
  .sim-name { display: block; font-size: 13px; font-weight: 500; color: #fff; margin-bottom: 2px; }
  .sim-sub { display: block; font-size: 10.5px; color: rgba(255,255,255,0.38); line-height: 1.4; }
  .cta-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 1.2rem; font-size: 12.5px; color: var(--srt-orange); text-decoration: none; opacity: 0.85; transition: opacity 0.2s; }
  .cta-link:hover { opacity: 1; }
  .cta-link svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 740px) {
    .wrap { grid-template-columns: 1fr; gap: 2rem; }
    .moon-stage { max-width: 320px; }
    .region-title { font-size: 24px; }
  }
</style>
</head>
